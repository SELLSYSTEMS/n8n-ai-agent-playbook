# Main-host reverse proxy template (n8n)
# Copy this to the main nginx host and replace:
# - <N8N_PUBLIC_DOMAIN>   -> your public domain
# - <INSTANCE_PRIVATE_IP>   -> instance private IP (reachable from main host)

server {
    listen 80;
    server_name <N8N_PUBLIC_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <N8N_PUBLIC_DOMAIN>;

    # SSL certificates are managed on the main host (wildcard cert already present).
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://<INSTANCE_PRIVATE_IP>:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
