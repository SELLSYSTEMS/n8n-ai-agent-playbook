# Main-host reverse proxy snippet (Nginx)
#
# Use this as a baseline for whichever proxy stack you run on the main host.
# The main host should terminate HTTPS (wildcard cert already in place) and proxy
# traffic to the instance's internal HTTP endpoint.

server {
    listen 80;
    server_name N8N_INSTANCE_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name N8N_INSTANCE_DOMAIN;

    # SSL managed on main host (wildcard certificate in place).
    # ssl_certificate /path/fullchain.pem;
    # ssl_certificate_key /path/privkey.pem;

    location / {
        proxy_pass http://INSTANCE_IP:N8N_INSTANCE_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
